[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-rating-tracker"
version = "0.1.0"
description = "Python CLI to log chess ratings over time from manual entry, with local JSON storage and CSV export."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Asdale Dynamics, LLC"}]

[project.scripts]
chess-rating-tracker = "chess_rating_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chess_rating_tracker*"]
